<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Community Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Community Club</a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Contact Us</h1>
    <form class="contact-form" action="#" method="post">
      <p>
        <label for="name">Name</label><br>
        <input id="name" name="name" type="text" required>
      </p>
      <p>
        <label for="email">Email</label><br>
        <input id="email" name="email" type="email" required>
      </p>
      <p>
        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="5"></textarea>
      </p>
      <p><button class="btn" type="submit">Send Message</button></p>
    </form>
    <p>If you need a working contact form you'll need a server-side handler or a service like Formspree or Netlify Forms.</p>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Community Club — All rights reserved.</p>
      <nav class="footer-nav">
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
