<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events — Community Club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Community Club</a>
      <button id="nav-toggle" class="nav-toggle" aria-label="Toggle navigation">☰</button>
      <nav class="site-nav" id="site-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1>Upcoming Events</h1>

    <div class="event-grid" aria-live="polite"></div>

    <section class="add-event" aria-labelledby="add-event-title">
      <h2 id="add-event-title">Add Event (local demo)</h2>
      <form class="add-event-form" aria-label="Add event">
        <label>
          Title
          <input name="title" type="text" required placeholder="Event title">
        </label>
        <label>
          Description
          <input name="desc" type="text" placeholder="Short description">
        </label>
        <p>
          <button class="btn" type="submit">Save event</button>
        </p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year"></span> Community Club — All rights reserved.</p>
      <nav class="footer-nav">
        <a href="about.html">About</a>
        <a href="events.html">Events</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
